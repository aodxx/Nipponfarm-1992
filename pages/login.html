<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>เข้าสู่ระบบ — Nipponfarm</title>
<meta name="theme-color" content="#EDE7DB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  .login-card h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 4px;
    text-align: center;
  }
  .login-card .sub {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 15px;
    padding: 10px 12px;
    border: 1.5px solid var(--rule);
    border-radius: 4px;
    background: var(--limewash);
    color: var(--ink);
    box-sizing: border-box;
  }
  .field input:focus-visible {
    outline: 2px solid var(--pasture);
    outline-offset: 1px;
  }
  .login-button {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    padding: 11px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .login-button:disabled { opacity: 0.6; cursor: default; }
  .login-error {
    color: var(--rust);
    font-size: 13.5px;
    margin: 0 0 16px;
    text-align: center;
  }
</style>
</head>
<body>

  <form class="login-card" id="login-form" novalidate>
    <span class="tag-mark" style="display:block; width: fit-content; margin: 0 auto 12px;">NF</span>
    <h1>Nipponfarm</h1>
    <p class="sub">เข้าสู่ระบบเพื่อจัดการฟาร์ม</p>

    <p class="login-error" id="login-error" hidden></p>

    <div class="field">
      <label for="email">อีเมล</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="login-button" id="login-button">เข้าสู่ระบบ</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
