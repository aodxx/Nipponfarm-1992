<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>เข้าสู่ระบบ — Nipponfarm</title>
<meta name="theme-color" content="#EDE7DB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 360px; }
  .login-card h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 4px;
    text-align: center;
  }
  .login-card .sub {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .login-card .button-primary { width: 100%; padding: 11px; }
  .login-card .error-text { text-align: center; }
</style>
</head>
<body>

  <form class="card login-card" id="login-form" novalidate>
    <span class="tag-mark" style="display:block; width: fit-content; margin: 0 auto 12px;">NF</span>
    <h1>Nipponfarm</h1>
    <p class="sub">เข้าสู่ระบบเพื่อจัดการฟาร์ม</p>

    <p class="error-text" id="login-error" hidden></p>

    <div class="field">
      <label for="email">อีเมล</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="button-primary" id="login-button">เข้าสู่ระบบ</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
